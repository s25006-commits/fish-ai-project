    #map {

    }

    #legend {
    position: absolute;
    bottom: 20px;
    left: 20px;
    z-index: 9999;

    background: rgba(255,255,255,0.95);
    padding: 12px;
    border-radius: 10px;

    font-size: 13px;
    line-height: 1.8;

    box-shadow: 0 0 8px rgba(0,0,0,0.3);
}

.legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 4px;
}

/* ⭐ 核心：双层圆 */
.icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 14px;
    margin-right: 8px;

    color: white;          /* 图标颜色 */
}
.circle-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
    position: relative;
    background: white;
    border: 4px solid red;
}

/* 斜杠（禁钓） */
.circle-icon.no-fishing::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 4px;
    background: red;
    top: 50%;
    left: 0;
    transform: rotate(-45deg);
}

/* 危险 */
.warning-icon {
    font-size: 20px;
    margin-right: 8px;
}
/* 对应地图颜色 */
.icon.ayu    { background: #FFD700; }  /* 🐟 */
.icon.amago  { background: #FF5722; }  /* 🐠 */
.icon.fish   { background: #FF9800; }  /* 🎣 */
.icon.toilet { background: #4CAF50; }  /* 🚻 */
.icon.parking{ background: #2196F3; }  /* 🅿 */

</head>

   function createCone(lat, lng, angle, spread = 60, distance = 0.0008) {
    var points = [];
    points.push([lat, lng]);

    for (var i = -spread/2; i <= spread/2; i += 5) {
        var rad = (angle + i) * Math.PI / 180;
        var newLat = lat + distance * Math.cos(rad);
        var newLng = lng + distance * Math.sin(rad);
        points.push([newLat, newLng]);
    }

    points.push([lat, lng]);
    return points;
}

function handleOrientation(event){

    if(event.alpha !== null){

        currentHeading = 360 - event.alpha;

        console.log(
            "手机方向:",
            currentHeading
        );


        // ⭐ 实时旋转箭头
        if(userMarker){

            userMarker.setRotationAngle(

        }

    }

}


function requestOrientationPermission() {

    if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
    ) {

        DeviceOrientationEvent.requestPermission()
            .then(response => {

                if (response === "granted") {

                    window.addEventListener(
                        "deviceorientation",
                        handleOrientation
                    );

                } else {
                    alert("方向センサー許可が必要です");
                }

            })
            .catch(console.error);

    } else {

        // 👉 安卓 / 普通浏览器
        window.addEventListener(
            "deviceorientation",
            handleOrientation
        );

    }
}
